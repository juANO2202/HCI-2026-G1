<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portal de Tutorías FISEI · Prototipo v2</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body data-version="2">
  <a class="skip" href="#main">Saltar al contenido</a>
  <header class="top">
    <strong>Portal de Tutorías · FISEI</strong>
    <nav aria-label="Principal">
      <button type="button" class="nav-btn" data-go="inicio">Inicio</button>
      <button type="button" class="nav-btn" data-go="mis">Mis tutorías</button>
    </nav>
  </header>

  <main id="main">
    <!-- PANTALLA 1: INICIO -->
    <section id="inicio" class="pantalla" aria-labelledby="t-inicio">
      <h1 id="t-inicio" tabindex="-1">Hola, Andrea</h1>
      <p>¿Qué necesitas hoy?</p>
      <button type="button" class="btn primario grande" id="btn-agendar">Agendar tutoría</button>
      <button type="button" class="btn secundario grande" data-go="mis">Ver mis tutorías</button>
    </section>

    <!-- PANTALLA 2: FORMULARIO (estados: normal, cargando, error) -->
    <section id="formulario" class="pantalla" aria-labelledby="t-form" hidden>
      <h1 id="t-form" tabindex="-1">Agendar tutoría</h1>
      <p class="ayuda">Los campos con * son obligatorios.</p>

      <div id="resumen-errores" class="resumen-error" role="alert" tabindex="-1" hidden></div>

      <form id="form" novalidate>
        <div class="campo">
          <label for="materia">Materia *</label>
          <select id="materia" name="materia" aria-describedby="err-materia"></select>
          <p class="error" id="err-materia" hidden></p>
        </div>

        <div class="campo">
          <label for="docente">Docente *</label>
          <select id="docente" name="docente" aria-describedby="err-docente"></select>
          <p class="error" id="err-docente" hidden></p>
        </div>

        <div class="campo">
          <label for="fecha">Fecha *</label>
          <select id="fecha" name="fecha" aria-describedby="err-fecha"></select>
          <p class="error" id="err-fecha" hidden></p>
        </div>

        <fieldset class="campo" aria-describedby="err-hora">
          <legend>Hora *</legend>
          <div id="horas" class="slots"></div>
          <p class="error" id="err-hora" hidden></p>
        </fieldset>

        <fieldset class="campo">
          <legend>Modalidad</legend>
          <label class="opcion"><input type="radio" name="modalidad" value="Presencial" checked> Presencial</label>
          <label class="opcion"><input type="radio" name="modalidad" value="Virtual"> Virtual</label>
        </fieldset>

        <div class="campo">
          <label for="motivo">¿Con qué necesitas ayuda? * <span class="ayuda">(mínimo 10 caracteres)</span></label>
          <textarea id="motivo" name="motivo" rows="3" aria-describedby="err-motivo"></textarea>
          <p class="error" id="err-motivo" hidden></p>
        </div>

        <p id="estado-envio" class="estado" role="status" aria-live="polite"></p>

        <div class="acciones">
          <button type="submit" class="btn primario" id="btn-enviar">Confirmar tutoría</button>
          <button type="button" class="btn secundario" data-go="inicio" id="btn-cancelar">Cancelar</button>
        </div>
      </form>
    </section>

    <!-- PANTALLA 3: ÉXITO -->
    <section id="exito" class="pantalla" aria-labelledby="t-exito" hidden>
      <div class="exito-icono" aria-hidden="true">✔</div>
      <h1 id="t-exito" tabindex="-1">¡Tutoría agendada!</h1>
      <dl class="resumen" id="resumen-exito"></dl>
      <p class="ayuda">Guarda tu código. Puedes cancelarla desde «Mis tutorías».</p>
      <button type="button" class="btn primario" data-go="mis">Ver mis tutorías</button>
      <button type="button" class="btn secundario" id="btn-otra">Agendar otra</button>
    </section>

    <!-- PANTALLA 4: MIS TUTORÍAS -->
    <section id="mis" class="pantalla" aria-labelledby="t-mis" hidden>
      <h1 id="t-mis" tabindex="-1">Mis tutorías</h1>
      <ul id="lista" class="lista"></ul>
      <p id="vacio" class="ayuda" hidden>Aún no tienes tutorías agendadas.</p>
      <button type="button" class="btn primario" id="btn-agendar2">Agendar tutoría</button>
    </section>
  </main>

  <div id="anuncios" class="solo-lector" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
